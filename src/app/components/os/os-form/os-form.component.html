<h2>Nova Ordem de Serviço</h2>

<form (ngSubmit)="adicionar()">
  <div class="input-container">
    <div class="field">
      <label for="veiculos"><strong>Veículo:</strong></label>
      <p-listbox
        [options]="veiculos"
        optionLabel="placa"
        [(ngModel)]="veiculoSelecionado"
        name="veiculoSelecionado"
        [filter]="true">
      </p-listbox>
    </div>
  </div>

  <div class="input-container">
    <div class="field">
      <label for="valorTotal"><strong>Valor total:</strong></label>
      <input id="valorTotal" type="number" pInputText [(ngModel)]="valorTotal" name="valorTotal" step="0.01" min="0" required />
    </div>

    <div class="field">
      <label for="valorPago"><strong>Valor pago:</strong></label>
      <input id="valorPago" type="number" pInputText [(ngModel)]="valorPago" name="valorPago" step="0.01" min="0" />
    </div>
  </div>

  <div class="input-container">
    <div class="field">
      <label for="dataInicio"><strong>Data de início:</strong></label>
      <p-datepicker
        id="dataInicio"
        [(ngModel)]="dataInicio"
        name="dataInicio"
        [minDate]="minDate"
        [maxDate]="maxDate"
        [showIcon]="true"
        [readonlyInput]="true"
        dateFormat="dd/mm/yy">
      </p-datepicker>
    </div>

    <div class="field">
      <label for="dataFim"><strong>Data de término:</strong></label>
      <p-datepicker
        id="dataFim"
        [(ngModel)]="dataFim"
        name="dataFim"
        [minDate]="minDate"
        [maxDate]="maxDate"
        [showIcon]="true"
        [readonlyInput]="true"
        dateFormat="dd/mm/yy">
      </p-datepicker>
    </div>
  </div>

  <div class="flex justify-content-end mt-4">
    <p-button type="submit" label="Salvar" icon="pi pi-check"></p-button>
  </div>
</form>

<p-toast></p-toast>
