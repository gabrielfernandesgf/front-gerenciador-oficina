<p-card>
  <ng-template pTemplate="header">
    <div class="card-header">
      <h2>Lista de Clientes</h2>
      <p-button label="Novo Cliente" icon="pi pi-plus" styleClass="p-button-success" (click)="navigateToNewCliente()" />
    </div>
  </ng-template>

  <p-table
    [value]="clientes"
    [paginator]="true"
    [rows]="5"
    [rowsPerPageOptions]="[5, 10, 20]"
    [tableStyle]="{ 'min-width': '50rem' }"
    styleClass="p-datatable-striped">
    <ng-template pTemplate="header">
      <tr>
        <th style="width:10%">ID</th>
        <th style="width:30%">Nome</th>
        <th style="width:30%">Email</th>
        <th style="width:20%">Telefone</th>
        <th style="width:10%; text-align: center;">Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-cliente>
      <tr>
        <td>{{ cliente.id }}</td>
        <td>{{ cliente.nome }}</td>
        <td>{{ cliente.email }}</td>
        <td>{{ cliente.telefone }}</td>
        <td style="text-align: center;">
          <p-button icon="pi pi-pencil" styleClass="p-button-warning mr-2" (click)="navigateToEditCliente(cliente.id)"></p-button>
          <p-button icon="pi pi-trash" styleClass="p-button-danger" (click)="confirmDelete(cliente.id)"></p-button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="text-center">Nenhum cliente encontrado.</td>
      </tr>
    </ng-template>
  </p-table>

</p-card>
