<div class="add-peca-toolbar">
  <p-dropdown
    [options]="pecasDisponiveis"
    [(ngModel)]="pecaSelecionadaParaAdicionar"
    optionLabel="nome"
    placeholder="Selecione uma peça para adicionar"
    [showClear]="true"
    styleClass="dropdown-peca">
  </p-dropdown>

  <p-button
    label="Adicionar peça"
    icon="pi pi-plus"
    (click)="adicionar()"
    [disabled]="!pecaSelecionadaParaAdicionar">
  </p-button>
</div>

<hr *ngIf="pecas.length > 0">
<div *ngFor="let peca of pecas; let i = index" class="peca-item">

  <div class="field-display">
    <strong>Peça:</strong>
    <span>{{ peca.descricao }}</span>
  </div>

  <div class="field-edit">
    <label>Quantidade:</label>
    <input
      [(ngModel)]="peca.quantidade"
      type="number"
      pInputText
      name="quantidadePeca{{i}}"
      (input)="emitirAlteracao()">
  </div>

  <div class="field-edit">
    <label>Valor Unitário:</label>
    <input
      [(ngModel)]="peca.valorUnitario"
      type="number"
      pInputText
      name="valorUnitarioPeca{{i}}"
      (input)="emitirAlteracao()">
  </div>

  <p-button
    icon="pi pi-trash"
    severity="danger"
    (click)="remover(i)"
    styleClass="p-button-rounded p-button-text">
  </p-button>
</div>
